<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101218">
<meta name="mobile-web-app-capable" content="yes">
<title>Control TV</title>
<style>
  :root {
    --bg: #101218; --panel: #1a1d26; --key: #262a36; --key-hi: #343949;
    --text: #eef0f6; --muted: #8b91a3; --accent: #4f8cff; --danger: #ff5d5d; --ok: #3ddc97;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  main { max-width: 420px; margin: 0 auto; min-height: 100%;
    padding: max(12px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }

  header { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.wait { background: #f5b942; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link { background: none; color: var(--muted); padding: 8px; font-size: 14px; }

  .k { background: var(--key); border-radius: 16px; height: 56px; display: grid; place-items: center;
    font-size: 15px; font-weight: 600; transition: transform .06s, background .06s; }
  .k:active, .k.down { background: var(--key-hi); transform: scale(.95); }
  .k svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .k.power { color: var(--danger); } .k.round { border-radius: 50%; width: 56px; }
  .row { display: grid; gap: 10px; }
  .c3 { grid-template-columns: repeat(3, 1fr); } .c4 { grid-template-columns: repeat(4, 1fr); }
  .top { display: flex; justify-content: space-between; }

  .dpad { position: relative; width: min(270px, 72vw); aspect-ratio: 1; margin: 2px auto;
    border-radius: 50%; background: var(--panel); }
  .dpad .k { position: absolute; background: none; width: 34%; height: 34%; border-radius: 50%; }
  .dpad .k:active, .dpad .k.down { background: var(--key-hi); }
  .dpad .up { top: 0; left: 33%; } .dpad .down-k { bottom: 0; left: 33%; }
  .dpad .left { left: 0; top: 33%; } .dpad .right { right: 0; top: 33%; }
  .dpad .okb { inset: 31%; width: 38%; height: 38%; background: var(--key); font-size: 17px; }

  .rockers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: stretch; }
  .rocker { background: var(--panel); border-radius: 18px; display: grid; }
  .rocker .k { background: none; } .rocker span { text-align: center; color: var(--muted); font-size: 12px; }
  .mid { display: grid; gap: 10px; }

  .shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .shortcuts .k { background: #f1f2f5; color: #15171c; border-radius: 28px; font-size: 17px; font-weight: 800; }
  .shortcuts .k:active { background: #d5d8e0; }
  .apps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .apps::-webkit-scrollbar { display: none; }
  .apps .k { height: 44px; padding: 0 16px; flex: none; border-radius: 22px; font-size: 14px; }
  .apps .add { color: var(--muted); border: 1px dashed var(--key-hi); background: none; }

  .textbar { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 48px; border-radius: 14px; border: 1px solid var(--key-hi);
    background: var(--panel); color: var(--text); padding: 0 14px; font: inherit;
    -webkit-user-select: text; user-select: text; outline: none; }
  input:focus { border-color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border-radius: 14px; height: 48px; padding: 0 18px; font-weight: 600; }
  .btn.ghost { background: var(--key); } .btn:disabled { opacity: .5; }

  .card { background: var(--panel); border-radius: 18px; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .card h2 { margin: 0; font-size: 18px; } .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .dev { background: var(--key); border-radius: 12px; padding: 12px 14px; text-align: left; width: 100%; }
  .dev small { color: var(--muted); display: block; }
  #code { text-align: center; font-size: 26px; letter-spacing: 8px; text-transform: uppercase; height: 60px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b1b1e;
    color: #ffd9d9; border: 1px solid var(--danger); padding: 10px 16px; border-radius: 12px;
    font-size: 14px; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <span class="dot" id="dot"></span>
    <div class="title"><b id="tvname">Control TV</b><small id="sub">Cargando…</small></div>
    <button class="link" id="forget" hidden>Cambiar TV</button>
  </header>

  <!-- Configuración / vinculación -->
  <section id="setup" hidden>
    <div class="card" id="step-host">
      <h2>Conectar con el televisor</h2>
      <p>El TV y este equipo deben estar en la misma red WiFi. Busca el TV o escribe su IP
         (en el TV: Ajustes → Red e Internet → tu red).</p>
      <button class="btn ghost" id="scan">Buscar televisores</button>
      <div id="devices" class="row"></div>
      <div class="textbar">
        <input id="host" inputmode="decimal" placeholder="192.168.1.50" autocomplete="off">
        <button class="btn" id="connect">Vincular</button>
      </div>
    </div>
    <div class="card" id="step-code" hidden>
      <h2>Ingresa el código</h2>
      <p>El televisor muestra un código de 6 caracteres en pantalla.</p>
      <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="pair">Confirmar</button>
      <button class="link" id="cancel">Cancelar</button>
    </div>
  </section>

  <!-- Control remoto -->
  <section id="remote" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="top">
      <button class="k round power" data-key="POWER" aria-label="Encender/apagar">
        <svg viewBox="0 0 24 24"><path d="M12 3v9M6.4 6.6a8 8 0 1 0 11.2 0"/></svg></button>
      <button class="k round" data-key="ALL_APPS" aria-label="Todas las apps">
        <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M5 5h3v3H5zm5.5 0h3v3h-3zM16 5h3v3h-3zM5 10.5h3v3H5zm5.5 0h3v3h-3zm5.5 0h3v3h-3zM5 16h3v3H5zm5.5 0h3v3h-3zm5.5 0h3v3h-3z"/></svg></button>
      <button class="k round" data-key="TV_INPUT" aria-label="Entrada">
        <svg viewBox="0 0 24 24"><path d="M3 12h11m-4-4 4 4-4 4M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg></button>
      <button class="k round" data-key="SETTINGS" aria-label="Ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2.2-1.3L14 3h-4l-.4 2.4a7 7 0 0 0-2.2 1.3l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.6l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2.2 1.3L10 21h4l.4-2.4a7 7 0 0 0 2.2-1.3l2.3.9 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/></svg></button>
    </div>

    <div class="dpad">
      <button class="k up" data-key="DPAD_UP" data-repeat aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      <button class="k left" data-key="DPAD_LEFT" data-repeat aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="k okb" data-key="DPAD_CENTER" data-long aria-label="OK">OK</button>
      <button class="k right" data-key="DPAD_RIGHT" data-repeat aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="k down-k" data-key="DPAD_DOWN" data-repeat aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>

    <div class="row c4">
      <button class="k" data-key="BACK" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="k" data-key="HOME" data-long aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10"/></svg></button>
      <button class="k" data-key="TV" aria-label="TV en vivo"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="m8 3 4 5 4-5"/></svg></button>
      <button class="k" data-key="MENU" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>

    <div class="rockers">
      <div class="rocker">
        <button class="k" data-key="VOLUME_UP" data-repeat aria-label="Subir volumen">＋</button>
        <span id="vol">VOL</span>
        <button class="k" data-key="VOLUME_DOWN" data-repeat aria-label="Bajar volumen">－</button>
      </div>
      <div class="mid">
        <button class="k" data-key="VOLUME_MUTE" aria-label="Silencio"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6"/></svg></button>
        <button class="k" data-key="GUIDE">Guía</button>
        <button class="k" data-key="INFO">Info</button>
      </div>
      <div class="rocker">
        <button class="k" data-key="CHANNEL_UP" data-repeat aria-label="Canal siguiente"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <span>CANAL</span>
        <button class="k" data-key="CHANNEL_DOWN" data-repeat aria-label="Canal anterior"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </div>

    <div class="row c4">
      <button class="k" data-key="MEDIA_REWIND" aria-label="Retroceder"><svg viewBox="0 0 24 24"><path d="m11 6-7 6 7 6zM20 6l-7 6 7 6z"/></svg></button>
      <button class="k" data-key="MEDIA_PLAY_PAUSE" aria-label="Reproducir/pausar"><svg viewBox="0 0 24 24"><path d="m4 5 9 7-9 7zM16 5v14M20 5v14"/></svg></button>
      <button class="k" data-key="MEDIA_STOP" aria-label="Detener"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
      <button class="k" data-key="MEDIA_FAST_FORWARD" aria-label="Adelantar"><svg viewBox="0 0 24 24"><path d="m13 6 7 6-7 6zM4 6l7 6-7 6z"/></svg></button>
    </div>

    <div class="shortcuts">
      <button class="k" id="gtd" style="color:#3d7bff">Gtd TV</button>
      <button class="k" data-app="https://www.netflix.com/title" style="color:#e50914;letter-spacing:1px">NETFLIX</button>
      <button class="k" data-app="https://www.youtube.com"><span><span style="color:#ff0033">▶</span>&nbsp;YouTube</span></button>
      <button class="k" data-app="https://app.primevideo.com" style="color:#1a98ff">prime video</button>
    </div>
    <div class="apps" id="apps"></div>

    <div class="textbar">
      <input id="text" placeholder="Escribir en el TV…" autocomplete="off" enterkeyhint="send">
      <button class="k" style="width:48px;height:48px" data-key="DEL" data-repeat aria-label="Borrar">⌫</button>
      <button class="btn" id="send">Enviar</button>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_APPS = [
  ["Disney+", "https://www.disneyplus.com"],
  ["Max", "com.wbd.stream"],
  ["Spotify", "com.spotify.tv.android"],
];
let state = null, currentApp = null, toastTimer;

function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(value));
  } catch { return null; }
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

async function api(path, body) {
  const opt = body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  let res, data;
  try { res = await fetch(path, opt); data = await res.json(); }
  catch { throw new Error("No hay respuesta del servidor."); }
  if (!res.ok) throw new Error(data.error || "Error");
  return data;
}
const call = (path, body) => api(path, body).then(render).catch(e => toast(e.message));

function render(s) {
  if (!s || !s.state) return s;
  state = s.state; currentApp = s.app || null;
  const inSetup = ["unconfigured", "pairing", "needs_pairing"].includes(state);
  $("setup").hidden = !inSetup; $("remote").hidden = inSetup;
  $("step-host").hidden = state === "pairing"; $("step-code").hidden = state !== "pairing";
  $("forget").hidden = inSetup;
  $("tvname").textContent = s.name || "Control TV";
  $("dot").className = "dot" + (state === "connected" ? " ok" : state === "connecting" || state === "pairing" ? " wait" : "");
  const sub = {
    unconfigured: "Sin televisor configurado",
    pairing: "Vinculando con " + s.host,
    needs_pairing: "Hay que vincular de nuevo",
    connecting: "Conectando con " + s.host + "…",
    connected: (s.is_on ? "Encendido" : "En reposo") + (s.app ? " · " + s.app : ""),
  }[state];
  $("sub").textContent = sub || "";
  if (state === "needs_pairing" && s.host && !$("host").value) $("host").value = s.host;
  const v = s.volume;
  $("vol").textContent = v && v.max ? (v.muted ? "MUTE" : "VOL " + v.level) : "VOL";
  return s;
}

/* ---- teclas: toque, repetición al mantener y pulsación larga ---- */
const sendKey = (key, direction) =>
  api("/api/key", { key, direction: direction || "SHORT" }).catch(e => toast(e.message));

document.querySelectorAll("[data-key]").forEach(btn => {
  const key = btn.dataset.key;
  let hold, repeat, long = false;
  const stop = () => {
    clearTimeout(hold); clearInterval(repeat); btn.classList.remove("down");
  };
  btn.addEventListener("pointerdown", e => {
    e.preventDefault(); btn.classList.add("down"); long = false;
    if (navigator.vibrate) navigator.vibrate(12);
    if ("repeat" in btn.dataset) {
      sendKey(key);
      hold = setTimeout(() => { repeat = setInterval(() => sendKey(key), 130); }, 400);
    } else if ("long" in btn.dataset) {
      hold = setTimeout(() => { long = true; sendKey(key, "START_LONG"); }, 500);
    }
  });
  btn.addEventListener("pointerup", () => {
    const wasDown = btn.classList.contains("down"); stop();
    if (!wasDown || "repeat" in btn.dataset) return;
    if (long) sendKey(key, "END_LONG"); else sendKey(key);
  });
  ["pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, () => {
    if (long) { sendKey(key, "END_LONG"); long = false; }
    stop();
  }));
  btn.addEventListener("contextmenu", e => e.preventDefault());
});

/* ---- apps ---- */
function renderApps() {
  const box = $("apps"); box.textContent = "";
  const custom = store("apps") || [];
  [...DEFAULT_APPS, ...custom].forEach(([label, id], i) => {
    const b = document.createElement("button");
    b.className = "k"; b.textContent = label;
    b.onclick = () => call("/api/app", { app: id });
    if (i >= DEFAULT_APPS.length) b.oncontextmenu = e => {
      e.preventDefault();
      if (confirm("¿Quitar " + label + "?")) {
        store("apps", custom.filter(a => a[1] !== id)); renderApps();
      }
    };
    box.appendChild(b);
  });
  const add = document.createElement("button");
  add.className = "k add"; add.textContent = "＋ App actual";
  add.onclick = () => {
    if (!currentApp) return toast("Abre la app en el TV primero.");
    const label = prompt("Nombre para " + currentApp + ":", currentApp.split(".").pop());
    if (!label) return;
    store("apps", [...custom.filter(a => a[1] !== currentApp), [label, currentApp]]); renderApps();
  };
  box.appendChild(add);
}

/* ---- accesos directos (como el control físico) ---- */
document.querySelectorAll("[data-app]").forEach(b => {
  b.onclick = () => { if (navigator.vibrate) navigator.vibrate(12); call("/api/app", { app: b.dataset.app }); };
});
// GTD SmartTV (Grupo Gtd) en Google Play: tv.gtd.atv
$("gtd").onclick = () => {
  if (navigator.vibrate) navigator.vibrate(12);
  call("/api/app", { app: "tv.gtd.atv" });
};

/* ---- texto ---- */
function sendText() {
  const input = $("text");
  if (!input.value) return call("/api/key", { key: "ENTER" });
  api("/api/text", { text: input.value }).then(() => { input.value = ""; }).catch(e => toast(e.message));
}
$("send").onclick = sendText;
$("text").addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });

/* ---- configuración ---- */
$("scan").onclick = async () => {
  const btn = $("scan"), box = $("devices");
  btn.disabled = true; btn.textContent = "Buscando…"; box.textContent = "";
  try {
    const { devices } = await api("/api/discover");
    if (!devices.length) toast("No encontré televisores. Escribe la IP a mano.");
    devices.forEach(d => {
      const b = document.createElement("button"); b.className = "dev";
      const small = document.createElement("small"); small.textContent = d.host;
      b.append(d.name, small);
      b.onclick = () => { $("host").value = d.host; startPair(); };
      box.appendChild(b);
    });
  } catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = "Buscar televisores";
};
async function startPair() {
  const host = $("host").value.trim();
  if (!host) return toast("Escribe la IP del televisor.");
  $("connect").disabled = true;
  await call("/api/pair/start", { host });
  $("connect").disabled = false;
  if (state === "pairing") { $("code").value = ""; $("code").focus(); }
}
$("connect").onclick = startPair;
$("pair").onclick = async () => {
  const code = $("code").value.trim();
  if (code.length !== 6) return toast("El código tiene 6 caracteres.");
  $("pair").disabled = true;
  await call("/api/pair/finish", { code });
  $("pair").disabled = false; $("code").value = "";
};
$("code").addEventListener("keydown", e => { if (e.key === "Enter") $("pair").click(); });
$("cancel").onclick = () => call("/api/forget", {});
$("forget").onclick = () => { if (confirm("¿Desvincular este televisor?")) call("/api/forget", {}); };

/* ---- estado ---- */
async function poll() {
  if (!document.hidden) {
    try { render(await api("/api/status")); }
    catch { $("dot").className = "dot"; $("sub").textContent = "Servidor sin respuesta"; }
  }
  setTimeout(poll, 2500);
}
renderApps(); poll();
</script>
</body>
</html>
